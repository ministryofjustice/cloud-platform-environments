# Frontend egress: DNS, the internal backend, and Entra token exchange only.
kind: NetworkPolicy
apiVersion: projectcalico.org/v3
metadata:
  name: allow-egress-frontend
  namespace: onboarding-optimisation-prod
spec:
  order: 49.0
  selector: "app == 'onboarding-optimisation-frontend'"
  egress:
    - action: Allow
      protocol: UDP
      destination:
        namespaceSelector: kubernetes.io/metadata.name == "kube-system"
        selector: k8s-app in {"kube-dns", "coredns"}
        ports:
          - 53
    - action: Allow
      protocol: TCP
      destination:
        namespaceSelector: kubernetes.io/metadata.name == "kube-system"
        selector: k8s-app in {"kube-dns", "coredns"}
        ports:
          - 53
    - action: Allow
      protocol: TCP
      destination:
        selector: app == "onboarding-optimisation-backend"
        ports:
          - 8000
    - action: Allow
      protocol: TCP
      destination:
        # Azure AD — token exchange at login.microsoftonline.com/oauth2/v2.0/token
        nets:
          - 20.190.128.0/18
          - 40.126.0.0/18
        ports:
          - 443
  types:
    - Egress
---
# Backend egress: DNS, RDS/VPC endpoints, and HTTPS external dependencies.
kind: NetworkPolicy
apiVersion: projectcalico.org/v3
