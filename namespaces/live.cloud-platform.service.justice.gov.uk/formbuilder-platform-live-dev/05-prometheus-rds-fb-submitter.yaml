apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: prometheus-rds-fb-submitter
  namespace: formbuilder-platform-live-dev
  labels:
    prometheus: cloud-platform
spec:
  groups:
  - name: formbuilder-platform-live-dev-rules
    rules:
      - alert: FormBuilder-Submitter-Live-Dev-RDS-HighCPUUtilization
        expr: aws_rds_cpuutilization_average{dbinstance_identifier="cloud-platform-8bad841c14b6ec2a"} > 85
        for: 1m
        labels:
          severity: form-builder-alerts-low-severity
        annotations:
          message: FormBuilder Submitter Live Dev - RDS CPU usage > 85%.
      - alert: FormBuilder-Submitter-Live-Dev-RDS-HighDatabaseConnections
        expr: aws_rds_database_connections_average{dbinstance_identifier="cloud-platform-8bad841c14b6ec2a"} > 840 # max: 840
        for: 1m
        labels:
          severity: form-builder-alerts-low-severity
        annotations:
          message: FormBuilder Submitter Live Dev - RDS number of database connections > 150.
      - alert: FormBuilder-Submitter-Live-Dev-RDS-LowStorage
        expr: aws_rds_free_storage_space_average{dbinstance_identifier="cloud-platform-8bad841c14b6ec2a"} < 1024*1024*1024
        for: 1m
        labels:
          severity: form-builder-alerts-low-severity
        annotations:
          message: FormBuilder Submitter Live Dev - RDS storage capacity < 1GB.
      - alert: FormBuilder-Submitter-Live-Dev-RDS-Freeable-Memory
        expr: aws_rds_freeable_memory_average{dbinstance_identifier="cloud-platform-8bad841c14b6ec2a"} < 500*1024*1024
        for: 1m
        labels:
          severity: form-builder-alerts-low-severity
        annotations:
          message: FormBuilder Submitter Live Dev - RDS freeable memory is less than 500MB
      - alert: FormBuilder-Submitter-Live-Dev-RDS-HighReadLatency
        expr: aws_rds_read_latency_average{dbinstance_identifier="cloud-platform-8bad841c14b6ec2a"} > 0.5
        for: 1m
        labels:
          severity: form-builder-alerts-low-severity
        annotations:
          message: FormBuilder Submitter Live Dev - RDS read latency > 500ms.
      - alert: FormBuilder-Submitter-Live-Dev-RDS-HighWriteLatency
        expr: aws_rds_write_latency_average{dbinstance_identifier="cloud-platform-8bad841c14b6ec2a"} > 0.5
        for: 1m
        labels:
          severity: form-builder-alerts-low-severity
        annotations:
          message: FormBuilder Submitter Live Dev - RDS write latency > 500ms.
