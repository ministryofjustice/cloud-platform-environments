apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  namespace: laa-data-claims-event-service-uat
  labels:
    prometheus: cloud-platform
    role: alert-rules
  name: prometheus-custom-rules-laa-data-claims-event-service-uat
spec:
  groups:
  - name: application-rules
    rules:
    - alert: NamespaceDown
      expr: absent(up{namespace="laa-data-claims-event-service-uat"}) == 1
      for: 1m
      labels:
        severity: laa-data-claims-event-service-uat
      annotations:
        message: Namespace laa-data-claims-event-service-uat is down.
        runbook_url: https://dsdmoj.atlassian.net/wiki/spaces/WHCZA/pages/5829263558/Runbook+Data+Claims
        dashboard_url: https://grafana.live.cloud-platform.service.justice.gov.uk/d/uat-ervice-uat-laims-events/4285d4b?orgId=1&from=now-15m&to=now&timezone=browser&var-container=uat-data-claims-events

    - alert: KubeLowPodCount
      expr: sum (kube_pod_status_phase{namespace="laa-data-claims-event-service-uat", phase="Running"}) < 1
      labels:
        severity: laa-data-claims-event-service-uat
      annotations:
        message: Namespace laa-data-claims-event-service-uat has fewer than expected number of running pods.
        runbook_url: https://dsdmoj.atlassian.net/wiki/spaces/WHCZA/pages/5829263558/Runbook+Data+Claims
        dashboard_url: https://grafana.live.cloud-platform.service.justice.gov.uk/d/uat-ervice-uat-laims-events/4285d4b?orgId=1&from=now-15m&to=now&timezone=browser&var-container=uat-data-claims-events

    - alert: KubeQuotaExceeded
      expr: 100 * kube_resourcequota{job="kube-state-metrics",type="used",namespace="laa-data-claims-event-service-uat"} / ignoring(instance, job, type) (kube_resourcequota{job="kube-state-metrics",type="hard",namespace="laa-data-claims-event-service-uat"} > 0) > 90
      for: 1m
      labels:
        severity: laa-data-claims-event-service-uat
      annotations:
        message: Namespace laa-data-claims-event-service-uat is using more than 90% of its allocated resources.
        runbook_url: https://dsdmoj.atlassian.net/wiki/spaces/WHCZA/pages/5829263558/Runbook+Data+Claims
        dashboard_url: https://grafana.live.cloud-platform.service.justice.gov.uk/d/uat-ervice-uat-laims-events/4285d4b?orgId=1&from=now-15m&to=now&timezone=browser&var-container=uat-data-claims-events

    - alert: SubmissionErrorDetected
      expr: |-
        sum(increase(claims_event_service_submissions_with_errors_total{namespace="laa-data-claims-event-service-uat"}[5m])) > 50
      for: 1m
      labels:
        severity: laa-data-claims-event-service-uat
      annotations:
        message: More than 50 submission errors in the last 5 minutes in laa-data-claims-event-service-uat. Check the logs for details.
        runbook_url: https://dsdmoj.atlassian.net/wiki/spaces/WHCZA/pages/5829263558/Runbook+Data+Claims
        dashboard_url: https://grafana.live.cloud-platform.service.justice.gov.uk/d/main-perf-ms-api-uat-a-claims-api/1b2d237?orgId=1&from=now-15m&to=now&timezone=browser&var-helmInstall=main&var-helmInstallClaimEventService=uat&var-helmInstallClaimUI=uat
  - name: sqs-rules
    rules:
    - alert: SqsOldestMessageAge
      expr: |-
        sum(aws_sqs_approximate_age_of_oldest_message_maximum{queue_name="laa-data-stewardship-payments-team-uat-laa-data-claims-api-uat-sqs-queue"} offset 5m) by (queue_name) > 600
      for: 10m
      labels:
        severity: laa-data-claims-event-service-uat
      annotations:
        message: SQS - {{ $labels.queue_name }} has a message older than 600 seconds (provisional threshold) for 10 minutes, check the event service consumer is healthy.
        runbook_url: https://dsdmoj.atlassian.net/wiki/spaces/WHCZA/pages/5829263558/Runbook+Data+Claims
        dashboard_url: https://grafana.live.cloud-platform.service.justice.gov.uk/d/uat-ervice-uat-laims-events/4285d4b?orgId=1&from=now-15m&to=now&timezone=browser&var-container=uat-data-claims-events

    - alert: SqsBacklog
      expr: |-
        sum(aws_sqs_approximate_number_of_messages_visible_maximum{queue_name="laa-data-stewardship-payments-team-uat-laa-data-claims-api-uat-sqs-queue"} offset 5m) by (queue_name) > 25
      for: 15m
      labels:
        severity: laa-data-claims-event-service-uat
      annotations:
        message: SQS - {{ $labels.queue_name }} has {{ $value }} visible messages (provisional threshold 25) for 15 minutes, check the event service consumer is healthy.
        runbook_url: https://dsdmoj.atlassian.net/wiki/spaces/WHCZA/pages/5829263558/Runbook+Data+Claims
        dashboard_url: https://grafana.live.cloud-platform.service.justice.gov.uk/d/uat-ervice-uat-laims-events/4285d4b?orgId=1&from=now-15m&to=now&timezone=browser&var-container=uat-data-claims-events

    - alert: SqaDlqNotEmpty
      expr: |-
        sum(delta(aws_sqs_approximate_number_of_messages_visible_maximum{queue_name="laa-data-stewardship-payments-team-uat-laa-data-claims-api-uat-sqs-queue-dlq"}[15m] offset 5m)) by (queue_name) > 0
      labels:
        severity: laa-data-claims-event-service-uat
      annotations:
        message: SQS - dead letter queue {{ $labels.queue_name }} received {{ $value }} new message(s) in the last 15 minutes, investigate failed messages.
        runbook_url: https://dsdmoj.atlassian.net/wiki/spaces/WHCZA/pages/5829263558/Runbook+Data+Claims
        dashboard_url: https://grafana.live.cloud-platform.service.justice.gov.uk/d/uat-ervice-uat-laims-events/4285d4b?orgId=1&from=now-15m&to=now&timezone=browser&var-container=uat-data-claims-events
