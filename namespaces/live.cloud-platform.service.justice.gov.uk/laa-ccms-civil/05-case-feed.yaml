apiVersion: v1
kind: ServiceAccount
metadata:
  name: regression-case-feed
  namespace: laa-ccms-civil
---
# Holds the regression suite's case feed. The suite writes its keys; leave data out of this file.
apiVersion: v1
kind: ConfigMap
metadata:
  name: regression-case-feed
  namespace: laa-ccms-civil
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: regression-case-feed
  namespace: laa-ccms-civil
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["regression-case-feed"]
    verbs: ["get", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: regression-case-feed
  namespace: laa-ccms-civil
subjects:
  - kind: ServiceAccount
    name: regression-case-feed
    namespace: laa-ccms-civil
roleRef:
  kind: Role
  name: regression-case-feed
  apiGroup: rbac.authorization.k8s.io
