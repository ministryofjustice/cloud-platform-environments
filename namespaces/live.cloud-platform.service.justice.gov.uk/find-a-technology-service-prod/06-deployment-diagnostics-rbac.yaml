# Allow deployment failure diagnostics for the existing Terraform-managed account.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: deployment-diagnostics
  namespace: find-a-technology-service-prod
rules:
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: deployment-diagnostics
  namespace: find-a-technology-service-prod
subjects:
  - kind: ServiceAccount
    name: cd-serviceaccount
    namespace: find-a-technology-service-prod
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: deployment-diagnostics
