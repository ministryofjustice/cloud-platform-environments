---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: hmpps-pin-phone-cert
  namespace: hmpps-pin-phone-preprod
spec:
  secretName: hmpps-pin-phone-cert
  issuerRef:
    name: letsencrypt-production
    kind: ClusterIssuer
  dnsNames:
    - pin-phone-preprod.prison.service.justice.gov.uk

