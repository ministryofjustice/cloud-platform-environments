---
kind: Role
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: hmpps-pds-platform-prototype-dev
  namespace: hmpps-pds-platform-prototype-dev
rules:
  - apiGroups: ["extensions", "apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: ["cert-manager.io"]
    resources: ["certificates", "issuers"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: [ "", "extensions" ]
    resources: [ "services", "ingresses", "configmaps", "pods/log" ]
    verbs: [ "get", "list", "watch" ]
  - apiGroups: [""]
    resources: ["events"]
    verbs: [ "get", "list", "watch", "create", "update", "patch"]
---
kind: RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: hmpps-pds-platform-prototype-dev-admin
  namespace: hmpps-pds-platform-prototype-dev
subjects:
  - kind: Group
    name: "github:hmpps-pds-platform-devs"
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: admin
  apiGroup: rbac.authorization.k8s.io

