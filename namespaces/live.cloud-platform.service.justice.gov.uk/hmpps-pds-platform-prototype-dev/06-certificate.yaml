---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: hmpps-pds-platform-prototype-api-cert
  namespace: hmpps-pds-platform-prototype-dev
spec:
  secretName: hmpps-pds-platform-prototype-api-cert
  issuerRef:
    name: letsencrypt-production
    kind: ClusterIssuer
  dnsNames:
    - hmpps-pds-platform-prototype-api-dev.hmpps.service.justice.gov.uk
    - '*.hmpps-pds-platform-prototype-api-dev.hmpps.service.justice.gov.uk'
