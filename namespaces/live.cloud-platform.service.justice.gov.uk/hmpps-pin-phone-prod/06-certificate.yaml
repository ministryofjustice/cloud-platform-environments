---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: hmpps-pin-phone-cert
  namespace: hmpps-pin-phone-prod
spec:
  secretName: hmpps-pin-phone-cert
  issuerRef:
    name: letsencrypt-production
    kind: ClusterIssuer
  dnsNames:
    - pin-phone.prison.service.justice.gov.uk

---
apiVersion: cert-manager.io/v1
