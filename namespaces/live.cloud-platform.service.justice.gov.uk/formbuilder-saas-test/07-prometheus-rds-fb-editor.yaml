apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: prometheus-rds-fb-editor
  namespace: formbuilder-saas-test
  labels:
    prometheus: cloud-platform
spec:
  groups:
  - name: formbuilder-saas-test-rules
    rules:
      - alert: FormBuilder-Editor-Test-RDS-HighCPUUtilization
        expr: aws_rds_cpuutilization_average{dbinstance_identifier="cloud-platform-39a50b9fc8f3c40b"} > 85
        for: 1m
        labels:
          severity: form-builder-alerts-low-severity
        annotations:
          message: FormBuilder Editor Test - RDS CPU usage > 85%.
      - alert: FormBuilder-Editor-Test-RDS-HighDatabaseConnections
        expr: aws_rds_database_connections_average{dbinstance_identifier="cloud-platform-39a50b9fc8f3c40b"} > 800 # max: 849
        for: 1m
        labels:
          severity: form-builder-alerts-low-severity
        annotations:
          message: FormBuilder Editor Test - RDS number of database connections > 150.
      - alert: FormBuilder-Editor-Test-RDS-LowStorage
        expr: aws_rds_free_storage_space_average{dbinstance_identifier="cloud-platform-39a50b9fc8f3c40b"} < 1024*1024*1024
        for: 1m
        labels:
          severity: form-builder-alerts-low-severity
        annotations:
          message: FormBuilder Editor Test - RDS storage capacity < 1GB.
      - alert: FormBuilder-Editor-Test-RDS-Freeable-Memory
        expr: aws_rds_freeable_memory_average{dbinstance_identifier="cloud-platform-39a50b9fc8f3c40b"} < 500*1024*1024
        for: 1m
        labels:
          severity: form-builder-alerts-low-severity
        annotations:
          message: FormBuilder Editor Test - RDS freeable memory is less than 500MB
      - alert: FormBuilder-Editor-Test-RDS-HighReadLatency
        expr: aws_rds_read_latency_average{dbinstance_identifier="cloud-platform-39a50b9fc8f3c40b"} > 0.5
        for: 1m
        labels:
          severity: form-builder-alerts-low-severity
        annotations:
          message: FormBuilder Editor Test - RDS read latency > 500ms.
      - alert: FormBuilder-Editor-Test-RDS-HighWriteLatency
        expr: aws_rds_write_latency_average{dbinstance_identifier="cloud-platform-39a50b9fc8f3c40b"} > 0.5
        for: 1m
        labels:
          severity: form-builder-alerts-low-severity
        annotations:
          message: FormBuilder Editor Test - RDS write latency > 500ms.
