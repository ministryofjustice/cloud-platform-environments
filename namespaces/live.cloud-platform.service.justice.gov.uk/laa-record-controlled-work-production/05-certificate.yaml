apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: rcw-production-cert
  namespace: laa-record-controlled-work-production
spec:
  secretName: rcw-production-cert-secret
  issuerRef:
    name: letsencrypt-production
    kind: ClusterIssuer
  dnsNames:
    - record-controlled-work.service.justice.gov.uk
