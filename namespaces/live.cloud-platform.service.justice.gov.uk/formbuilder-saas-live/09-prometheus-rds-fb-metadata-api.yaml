apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: prometheus-rds-fb-metadata-api
  namespace: formbuilder-saas-live
  labels:
    prometheus: cloud-platform
spec:
  groups:
  - name: formbuilder-saas-live-rules
    rules:
      - alert: FormBuilder-Metadata-Api-Live-RDS-HighCPUUtilization
        expr: aws_rds_cpuutilization_average{dbinstance_identifier="cloud-platform-0f2486b54a8e2c97"} > 85
        for: 1m
        labels:
          severity: form-builder-alerts
        annotations:
          message: FormBuilder Metadata-Api Live - RDS CPU usage > 85%.
      - alert: FormBuilder-Metadata-Api-Live-RDS-HighDatabaseConnections
        expr: aws_rds_database_connections_average{dbinstance_identifier="cloud-platform-0f2486b54a8e2c97"} > 150 # max: 190
        for: 1m
        labels:
          severity: form-builder-alerts
        annotations:
          message: FormBuilder Metadata-Api Live - RDS number of database connections > 150.
      - alert: FormBuilder-Metadata-Api-Live-RDS-LowStorage
        expr: aws_rds_free_storage_space_average{dbinstance_identifier="cloud-platform-0f2486b54a8e2c97"} < 1024*1024*1024
        for: 1m
        labels:
          severity: form-builder-alerts
        annotations:
          message: FormBuilder Metadata-Api Live - RDS storage capacity < 1GB.
      - alert: FormBuilder-Metadata-Api-Live-RDS-Freeable-Memory
        expr: aws_rds_freeable_memory_average{dbinstance_identifier="cloud-platform-0f2486b54a8e2c97"} < 500*1024*1024
        for: 1m
        labels:
          severity: form-builder-alerts
        annotations:
          message: FormBuilder Metadata-Api Live - RDS freeable memory is less than 500MB
      - alert: FormBuilder-Metadata-Api-Live-RDS-HighReadLatency
        expr: aws_rds_read_latency_average{dbinstance_identifier="cloud-platform-0f2486b54a8e2c97"} > 0.5
        for: 1m
        labels:
          severity: form-builder-alerts
        annotations:
          message: FormBuilder Metadata-Api Live - RDS read latency > 500ms.
      - alert: FormBuilder-Metadata-Api-Live-RDS-HighWriteLatency
        expr: aws_rds_write_latency_average{dbinstance_identifier="cloud-platform-0f2486b54a8e2c97"} > 0.5
        for: 1m
        labels:
          severity: form-builder-alerts
        annotations:
          message: FormBuilder Metadata-Api Live - RDS write latency > 500ms.
