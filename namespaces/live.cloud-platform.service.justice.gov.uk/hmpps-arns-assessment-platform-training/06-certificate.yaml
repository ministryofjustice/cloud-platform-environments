---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: hmpps-arns-assessment-platform-ui-training
  namespace: hmpps-arns-assessment-platform-training
spec:
  secretName: hmpps-arns-assessment-platform-ui-cert
  issuerRef:
    name: letsencrypt-production
    kind: ClusterIssuer
  dnsNames:
    - arns-assessment-platform-training.hmpps.service.justice.gov.uk
    - '*.arns-assessment-platform-training.hmpps.service.justice.gov.uk'

