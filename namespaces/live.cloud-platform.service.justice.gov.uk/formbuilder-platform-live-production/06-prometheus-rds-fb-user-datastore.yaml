apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: prometheus-rds-fb-user-datastore
  namespace: formbuilder-platform-live-production
  labels:
    prometheus: cloud-platform
spec:
  groups:
  - name: formbuilder-platform-live-production-rules
    rules:
      - alert: FormBuilder-User-Datastore-Live-Production-RDS-HighCPUUtilization
        expr: aws_rds_cpuutilization_average{dbinstance_identifier="cloud-platform-0de5d47b58e993d4"} > 85
        for: 1m
        labels:
          severity: form-builder-alerts
        annotations:
          message: FormBuilder User Datastore Live Production - RDS CPU usage > 85%.
      - alert: FormBuilder-User-Datastore-Live-Production-RDS-HighDatabaseConnections
        expr: aws_rds_database_connections_average{dbinstance_identifier="cloud-platform-0de5d47b58e993d4"} > 1500 # max: 1710
        for: 1m
        labels:
          severity: form-builder-alerts
        annotations:
          message: FormBuilder User Datastore Live Production - RDS number of database connections > 150.
      - alert: FormBuilder-User-Datastore-Live-Production-RDS-LowStorage
        expr: aws_rds_free_storage_space_average{dbinstance_identifier="cloud-platform-0de5d47b58e993d4"} < 1024*1024*1024
        for: 1m
        labels:
          severity: form-builder-alerts
        annotations:
          message: FormBuilder User Datastore Live Production - RDS storage capacity < 1GB.
      - alert: FormBuilder-User-Datastore-Live-Production-RDS-Freeable-Memory
        expr: aws_rds_freeable_memory_average{dbinstance_identifier="cloud-platform-0de5d47b58e993d4"} < 500*1024*1024
        for: 1m
        labels:
          severity: form-builder-alerts
        annotations:
          message: FormBuilder User Datastore Live Production - RDS freeable memory is less than 500MB
      - alert: FormBuilder-User-Datastore-Live-Production-RDS-HighReadLatency
        expr: aws_rds_read_latency_average{dbinstance_identifier="cloud-platform-0de5d47b58e993d4"} > 0.5
        for: 1m
        labels:
          severity: form-builder-alerts
        annotations:
          message: FormBuilder User Datastore Live Production - RDS read latency > 500ms.
      - alert: FormBuilder-User-Datastore-Live-Production-RDS-HighWriteLatency
        expr: aws_rds_write_latency_average{dbinstance_identifier="cloud-platform-0de5d47b58e993d4"} > 0.5
        for: 1m
        labels:
          severity: form-builder-alerts
        annotations:
          message: FormBuilder User Datastore Live Production - RDS write latency > 500ms.
