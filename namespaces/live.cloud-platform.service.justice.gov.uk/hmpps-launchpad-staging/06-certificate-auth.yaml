---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: hmpps-launchpad-auth-cert
  namespace: hmpps-launchpad-staging
spec:
  secretName: hmpps-launchpad-auth-cert
  issuerRef:
    name: letsencrypt-production
    kind: ClusterIssuer
  dnsNames:
    - launchpad-auth-staging.hmpps.service.justice.gov.uk
