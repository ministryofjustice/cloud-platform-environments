---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  namespace: laa-manage-your-civil-cases-production
  labels:
    role: alert-rules
  name: prometheus-custom-rules-mcc
spec:
  groups:
    - name: application-rules
      rules:
        - alert: MCCProduction5xxIngressResponses
          # We are explicitly not interested in 501s, as these are used when a client sends an unsupported HTTP verb, which is not an error state.
          expr: |-
            sum by (ingress)(nginx_ingress_controller_requests{exported_namespace="laa-manage-your-civil-cases-production",status=~"500|502|503|504"}) - sum by (ingress)(nginx_ingress_controller_requests{exported_namespace="laa-manage-your-civil-cases-production",status=~"500|502|503|504"} offset 2m) > 0
          labels:
            severity: laa-manage-your-civil-cases-production
          annotations:
            message: PRODUCTION ingress {{ $labels.ingress }} is serving 5xx responses.
            runbook_url: https://ministryofjustice.github.io/laa-manage-your-civil-cases/
            dashboard_url: https://grafana.live.cloud-platform.service.justice.gov.uk/d/djtEK4abc/ccq-ingress-check-if-your-client-qualifies-for-legal-aid?orgId=1&var-namespace=laa-manage-your-civil-cases-production&var-ingress=check-client-qualifies-laa-estimate-eligibility
        - alert: MCCProductionLowPodCount
          expr: |-
            sum (kube_pod_status_phase{namespace="laa-manage-your-civil-cases-production", job="kube-state-metrics", phase="Running"}) < 4
          for: 1m
          labels:
            severity: laa-manage-your-civil-cases-production
          annotations:
            message: PRODUCTION environment has fewer than 4 running pods
            runbook_url: https://ministryofjustice.github.io/laa-manage-your-civil-cases/
            dashboard_url: https://grafana.live.cloud-platform.service.justice.gov.uk/d/a2ad4e88-e130-46ee-bafa-75cf69a10e72/mcc-ingress-manage-your-civil-cases?var-namespace=laa-manage-your-civil-cases-production
    - name: ingress-alert
      rules:
        - alert: NginxIngressSuccessRate-modsec-ingress
          annotations:
            message:
              "Percentage of successful requests of nginx-modsec over the last 10 minutes is less than 95%.
              NOTE: Ignoring 404s, 499s, 403s & 406s in this metric, since a  404 is a normal response for errant requests and 403/406 are handled by the Modsec rule."
            runbook_url: https://github.com/ministryofjustice/cloud-platform-terraform-monitoring/blob/main/resources/prometheusrule-alerts/README.md#nginx-success-rate
            dashboard_url: https://grafana.live.cloud-platform.service.justice.gov.uk/d/a2ad4e88-e130-46ee-bafa-75cf69a10e72/mcc-ingress-manage-your-civil-legal-advice-cases
          expr:
            sum(rate(nginx_ingress_controller_requests{status!~"[4-5].*", controller_class=~"k8s.io/ingress-modsec", host=~"main-manage-your-civil-cases-uat.cloud-platform.service.justice.gov.uk"}[5m]))/(sum(rate(nginx_ingress_controller_requests{controller_class=~"k8s.io/ingress-modsec", host=~"main-manage-your-civil-cases-uat.cloud-platform.service.justice.gov.uk"}[5m]))-
            sum(rate(nginx_ingress_controller_requests{status=~"404|499|403|406", controller_class=~"k8s.io/ingress-modsec", host=~"main-manage-your-civil-cases-uat.cloud-platform.service.justice.gov.uk"}[5m]))) * 100 < 95
          for: 1m
          labels:
            severity: laa-manage-your-civil-cases-production
        - alert: ModSecurityBlocking
          annotations:
            message: ingress {{ $labels.ingress }} is serving 403/406 responses. Modsec could be blocking traffic.
            runbook_url: https://ministryofjustice.github.io/laa-manage-your-civil-cases/
            dashboard_url: https://grafana.live.cloud-platform.service.justice.gov.uk/d/a2ad4e88-e130-46ee-bafa-75cf69a10e72/mcc-ingress-manage-your-civil-legal-advice-cases
          # 403/406 responses from the modsec ingress do not contain the namespace and therefore can only be
          # located via the host.
          expr: >-
            sum(rate(nginx_ingress_controller_requests{host=~"main-manage-your-civil-cases-uat.cloud-platform.service.justice.gov.uk", status=~"403|406"}[5m])) > 0
          for: 1m
          labels:
            severity: laa-manage-your-civil-cases-production