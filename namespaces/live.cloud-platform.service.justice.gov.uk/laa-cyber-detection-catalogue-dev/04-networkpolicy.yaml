apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default
  namespace: laa-cyber-detection-catalogue-dev
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  ingress: []
---
kind: NetworkPolicy
apiVersion: networking.k8s.io/v1
metadata:
  name: allow-ingress-controllers
  namespace: laa-cyber-detection-catalogue-dev
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: laa-cyber-detection-catalogue
      app.kubernetes.io/instance: catalogue-dev
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          component: ingress-controllers
    ports:
    - protocol: TCP
      port: 3000
