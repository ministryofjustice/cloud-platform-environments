  namespace: hmpps-san-dev
spec:
  secretName: hmpps-san-dev-portal-test-cert
  issuerRef:
    name: letsencrypt-production
    kind: ClusterIssuer
  dnsNames:
  - hmpps-san-dev-portal-test.hmpps.service.justice.gov.uk
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: hmpps-health-ping-cert
