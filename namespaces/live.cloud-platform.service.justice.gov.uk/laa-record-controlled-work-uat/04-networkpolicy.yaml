# rcw specific egress rules
############################################################
---
apiVersion: projectcalico.org/v3
kind: NetworkPolicy
metadata:
  name: rcw-egress-to-rcw-api
  namespace: laa-record-controlled-work-uat
spec:
  order: 49.0
  selector: app.kubernetes.io/component == 'rcw'
  types:
  - Egress
  egress:
  - action: Allow
    destination:
      namespaceSelector: cloud-platform.justice.gov.uk/namespace == 'laa-record-controlled-work-api-uat'
      ports:
      - "8081"
      selector: app.kubernetes.io/instance == 'laa-record-controlled-work-api'
    protocol: TCP
