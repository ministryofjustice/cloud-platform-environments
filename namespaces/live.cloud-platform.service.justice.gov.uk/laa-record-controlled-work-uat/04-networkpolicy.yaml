# ingress rules are configured and maintained in the RCW service helm chart
############################################################
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default
  namespace: laa-record-controlled-work-uat
spec:
  podSelector: {}
  policyTypes:
    - Ingress


# broad egress rules
############################################################
---
kind: NetworkPolicy
apiVersion: projectcalico.org/v3
metadata:
  name: block-egress
  namespace: laa-record-controlled-work-uat
spec:
  order: 50.0
  selector: all()
  egress:
    - action: Deny
  types:
    - Egress

---
apiVersion: projectcalico.org/v3
kind: NetworkPolicy
metadata:
  name: namespace-egress-to-k8s-dns
  namespace: laa-record-controlled-work-uat
spec:
  order: 49.0
  selector: all()
  types:
  - Egress
  egress:
  - action: Allow
    destination:
      namespaceSelector: kubernetes.io/metadata.name == 'kube-system'
      ports:
      - "53"
      selector: k8s-app in {'kube-dns', 'coredns'}
    protocol: UDP
  - action: Allow
    destination:
      namespaceSelector: kubernetes.io/metadata.name == 'kube-system'
      ports:
      - "53"
      selector: k8s-app in {'kube-dns', 'coredns'}
    protocol: TCP


# composite egress rules
############################################################
---
# no way to limit this to Cloud Platform public ingress currently
apiVersion: projectcalico.org/v3
kind: NetworkPolicy
metadata:
  name: ccq-rcw-egress-to-https
  namespace: laa-record-controlled-work-uat
spec:
  order: 49.0
  selector: app.kubernetes.io/component in {'ccq', 'rcw'}
  types:
  - Egress
  egress:
  - action: Allow
    destination:
      ports:
      - "443"
    protocol: TCP

---
# https://docs.sentry.io/security-legal-pii/security/ip-ranges/#event-ingestion
# currently redundant due to Allow 443 rule.
apiVersion: projectcalico.org/v3
kind: NetworkPolicy
metadata:
  name: ccq-rcw-egress-to-sentry
  namespace: laa-record-controlled-work-uat
spec:
  order: 49.0
  selector: app.kubernetes.io/component in {'ccq', 'rcw'}
  types:
  - Egress
  egress:
  - action: Allow
    destination:
      nets:
      - 34.160.81.0/32
      - 34.102.210.18/32
      - 2600:1901:0:5e8a::/64
      - 2600:1901:0:7edb::/64
      ports:
      - "443"
    protocol: TCP

---
apiVersion: projectcalico.org/v3
kind: NetworkPolicy
metadata:
  name: ccq-nginx-egress-to-rcw
  namespace: laa-record-controlled-work-uat
spec:
  order: 49.0
  selector: app.kubernetes.io/component in {'ccq', 'nginx'}
  types:
  - Egress
  egress:
  - action: Allow
    destination:
      ports:
      - "3000"
      selector: app.kubernetes.io/component == 'rcw'
    protocol: TCP

---
apiVersion: projectcalico.org/v3
kind: NetworkPolicy
metadata:
  name: ccq-rcw-egress-to-redis
  namespace: laa-record-controlled-work-uat
spec:
  order: 49.0
  selector: app.kubernetes.io/component in {'ccq', 'rcw'}
  types:
  - Egress
  egress:
  - action: Allow
    destination:
      nets:
      - 172.20.0.0/16
      ports:
      - "6379"
    protocol: TCP


# nginx specific egress rules
############################################################
---
