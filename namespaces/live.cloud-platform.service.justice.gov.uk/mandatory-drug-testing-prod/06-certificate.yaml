apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: hmpps-mandatory-drug-testing-api-cert
  namespace: mandatory-drug-testing-prod
spec:
  secretName: hmpps-mandatory-drug-testing-api-cert
  issuerRef:
    name: letsencrypt-production
    kind: ClusterIssuer
  dnsNames:
    - mandatory-drug-testing-api.hmpps.service.justice.gov.uk
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: hmpps-mandatory-drug-testing-ui-cert
  namespace: mandatory-drug-testing-prod
spec:
  secretName: hmpps-mandatory-drug-testing-ui-cert
  issuerRef:
    name: letsencrypt-production
    kind: ClusterIssuer
  dnsNames:
    - mandatory-drug-testing.hmpps.service.justice.gov.uk