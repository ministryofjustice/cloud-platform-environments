apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  namespace: laa-civil-manage-api-dev
  labels:
    role: alert-rules
  name: prometheus-custom-rules-laa-civil-manage-api-dev
spec:
  groups:
  - name: application-rules
    rules:
    - alert: NoPodsRunning
      expr: sum by (namespace) (kube_deployment_status_replicas_available{namespace="laa-civil-manage-api-dev", deployment="laa-civil-manage-api"}) == 0 or absent(kube_deployment_status_replicas_available{namespace="laa-civil-manage-api-dev", deployment="laa-civil-manage-api"})
      for: 5m
      labels:
        severity: laa-civil-manage-dev
      annotations:
        message: "CRITICAL: laa-civil-manage-api has zero ready pods in the laa-civil-manage-api-dev namespace."

    - alert: PodCrashLooping
      expr: |
        max by (namespace, pod, container) (increase(kube_pod_container_status_restarts_total{namespace="laa-civil-manage-api-dev"}[15m])) > 2
        or
        max by (namespace, pod, container) (max_over_time(kube_pod_container_status_waiting_reason{namespace="laa-civil-manage-api-dev", reason="CrashLoopBackOff"}[5m])) >= 1
      for: 5m
      labels:
        severity: laa-civil-manage-dev
      annotations:
        message: "Warning: container {{ $labels.container }} in pod {{ $labels.pod }} ({{ $labels.namespace }}) is crash looping or restarting repeatedly."

    - alert: PodNotReady
      expr: sum by (namespace, pod) (kube_pod_status_phase{namespace="laa-civil-manage-api-dev", phase=~"Pending|Unknown"}) > 0
      for: 15m
      labels:
        severity: laa-civil-manage-dev
      annotations:
        message: "Pod {{ $labels.pod }} in {{ $labels.namespace }} has been Pending/Unknown for over 15 minutes (stuck deploy: image pull, quota or scheduling). Production may still be on the old version."

    - alert: DeploymentReplicasMismatch
      expr: kube_deployment_status_replicas_available{namespace="laa-civil-manage-api-dev", deployment="laa-civil-manage-api"} < kube_deployment_spec_replicas{namespace="laa-civil-manage-api-dev", deployment="laa-civil-manage-api"}
      for: 15m
      labels:
        severity: laa-civil-manage-dev
      annotations:
        message: "laa-civil-manage-api has fewer ready pods than desired for 15m (running with reduced capacity)."

    - alert: Auth401Unauthorized
      expr: sum by (namespace) (increase(http_server_requests_seconds_count{status="401", namespace="laa-civil-manage-api-dev"}[5m])) > 20
      for: 1m
      labels:
        severity: laa-civil-manage-dev
      annotations:
        message: "401 Unauthorized spike ({{ printf \"%.0f\" $value }}/5m). Check for invalid/expired Entra ID tokens or wrong audience/issuer config."

    - alert: Auth403Forbidden
      expr: sum by (namespace) (increase(http_server_requests_seconds_count{status="403", namespace="laa-civil-manage-api-dev"}[5m])) > 20
      for: 1m
      labels:
        severity: laa-civil-manage-dev
      annotations:
        message: "403 Forbidden spike ({{ printf \"%.0f\" $value }}/5m). Missing scopes/roles. Check Azure app registration permissions."

    - alert: ServerErrors
      expr: sum by (namespace) (increase(http_server_requests_seconds_count{namespace="laa-civil-manage-api-dev", status=~"5.."}[5m])) > 5
      for: 5m
      labels:
        severity: laa-civil-manage-dev
      annotations:
        message: "{{ printf \"%.0f\" $value }} 5xx errors in 5m. 502 = a downstream API failed; 500 = app error (check logs, e.g. expired Entra client secret)."

    - alert: MetricsScrapeDown
      expr: sum by (namespace) (up{namespace="laa-civil-manage-api-dev", service="laa-civil-manage-api"}) == 0 or absent(up{namespace="laa-civil-manage-api-dev", service="laa-civil-manage-api"})
      for: 10m
      labels:
        severity: laa-civil-manage-dev
      annotations:
        message: "Prometheus cannot scrape /metrics for laa-civil-manage-api-dev, so error and auth alerts are not working."