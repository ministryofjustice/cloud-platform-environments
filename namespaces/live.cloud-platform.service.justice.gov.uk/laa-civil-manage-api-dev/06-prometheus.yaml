apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  namespace: laa-civil-manage-api-dev
  labels:
    role: alert-rules
  name: prometheus-custom-rules-laa-civil-manage-api-dev
spec:
  groups:
  - name: application-rules
    rules:
    
    - alert: NoPodsRunning
      expr: sum(kube_pod_status_phase{namespace="laa-civil-manage-api-dev", phase="Running"}) == 0 or absent(kube_pod_status_phase{namespace="laa-civil-manage-api-dev", phase="Running"})
      for: 5m
      labels:
        severity: laa-civil-manage-dev
      annotations:
        message: "CRITICAL: There are zero running pods in the laa-civil-manage-api-dev namespace."

    - alert: PodCrashLooping
      expr: kube_pod_container_status_waiting_reason{namespace="laa-civil-manage-api-dev", reason="CrashLoopBackOff"} > 0
      for: 10m
      labels:
        severity: laa-civil-manage-dev
      annotations:
        message: "Warning: a pod in namespace {{ $labels.namespace }} has been in CrashLoopBackOff for over 10 minutes."
    
    - alert: Auth401Unauthorized
      expr: sum(increase(http_server_requests_seconds_count{status="401", namespace="laa-civil-manage-api-dev"}[5m])) > 20
      for: 1m
      labels:
        severity: laa-civil-manage-dev
      annotations:
        message: "401 Unauthorized spike ({{ printf \"%.0f\" $value }}/5m). Check for expired secrets or invalid Entra ID tokens."

    - alert: Auth403Forbidden
      expr: sum(increase(http_server_requests_seconds_count{status="403", namespace="laa-civil-manage-api-dev"}[5m])) > 20
      for: 1m
      labels:
        severity: laa-civil-manage-dev
      annotations:
        message: "403 Forbidden spike ({{ printf \"%.0f\" $value }}/5m). Missing scopes/roles. Check Azure app registration permissions."