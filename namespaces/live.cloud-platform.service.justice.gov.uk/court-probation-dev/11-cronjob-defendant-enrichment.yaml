apiVersion: batch/v1
kind: CronJob
metadata:
  name: defendant-enrichment
  namespace: court-probation-dev
spec:
  schedule: "0 3 * * *"
  timeZone: "Europe/London"
  suspend: true # Enable only after the enrichment workflow is implemented
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 3300
      ttlSecondsAfterFinished: 86400
      template:
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          containers:
            - name: invoke-enrichment
              image: ghcr.io/ministryofjustice/hmpps-devops-tools@sha256:1db10aea5c1d3c0ca862e4d12842c9a5f0a87b8d5f4840d40d474867e21943e7
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 200m
                  memory: 128Mi
              env:
                - name: ENRICHMENT_URL
                  value: "http://hmpps-court-case-enrichment-worker:8080/jobs/enrich-defendants"
                - name: TOKEN_URL
                  value: "https://sign-in-dev.hmpps.service.justice.gov.uk/auth/oauth/token"
                - name: CLIENT_ID
                  valueFrom:
                    secretKeyRef:
                      name: defendant-enrichment-cronjob-oauth
                      key: client-id
                - name: CLIENT_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: defendant-enrichment-cronjob-oauth
                      key: client-secret
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu

                  TOKEN_RESPONSE=$(curl --silent --show-error --fail \
                    --connect-timeout 10 --max-time 30 --retry 0 \
                    --user "$CLIENT_ID:$CLIENT_SECRET" \
                    --data-urlencode "grant_type=client_credentials" \
                    "$TOKEN_URL")

                  TOKEN=$(printf '%s' "$TOKEN_RESPONSE" |
                    jq -er '.access_token | select(type == "string" and length > 0)')

                  curl --silent --show-error --fail \
                    --connect-timeout 10 --max-time 3200 --retry 0 \
                    --request POST \
                    --header "Authorization: Bearer $TOKEN" \
                    --output /dev/null \
                    "$ENRICHMENT_URL"

                  echo "Defendant enrichment invocation completed successfully"
